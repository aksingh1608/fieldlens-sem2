# Evaluation and robustness settings

threshold: 0.5
tile_positive_fraction: 0.01  # 1 percent of valid pixels
tile_score: covered_fraction  # covered_fraction | mean_probability

efficiency:
  warmup: 10
  timed_tiles: 50

robustness:
  severities: [0, 1, 2, 3, 4]
  # Drone condition parameters per severity (0 = identity).
  # Applied identically to RGB and NIR.
  motion_blur_ksizes: [0, 3, 5, 7, 11]
  downscale_factors: [1.0, 0.75, 0.5, 0.35, 0.25]
  brightness_deltas: [0.0, 0.08, 0.15, 0.25, 0.35]  # added to [0,1] image, clipped
  gaussian_noise_stds: [0.0, 0.02, 0.05, 0.08, 0.12]  # on [0,1] scale
